<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="login-form.css">
</head>
<body>

    <div class="navbar">
        <a href="#" class="nav-brand">Login Form</a>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Contact</a>
            <div class="bell">
                &#128276;
                <span class="bell-dot"></span>
            </div>
        </div>
    </div>

    <div class="login-box">

        <a href="#" class="close-btn">&times;</a>
        <h2>Login Form</h2>

        <form>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password" required minlength="7">
                <span class="clear-btn">&times;</span>
            </div>
            <p class="hint">Password must be greater than 6 characters</p>

            <button type="submit">Login</button>
        </form>

    </div>

    <div class="chat-btn">&#128172;</div>

</body>
</html>
