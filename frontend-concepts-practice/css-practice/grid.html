<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Practice</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { padding: 20px; background: #f0f2f5; }
        h1, h2 { margin-bottom: 12px; }
        .section { background: white; padding: 16px; margin-bottom: 20px; border-radius: 8px; }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .card {
            background: #6366f1;
            color: white;
            padding: 24px;
            border-radius: 6px;
            text-align: center;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 60px 1fr 50px;
            gap: 10px;
            height: 300px;
        }

        .header { grid-column: 1 / -1; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; }
        .sidebar { background: #334155; color: white; display: flex; align-items: center; justify-content: center; }
        .main { background: #e2e8f0; display: flex; align-items: center; justify-content: center; }
        .footer { grid-column: 1 / -1; background: #64748b; color: white; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <h1>CSS Grid Practice</h1>

    <div class="section">
        <h2>Auto-Fit Responsive Grid</h2>
        <div class="grid-cards">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div>
        </div>
    </div>

    <div class="section">
        <h2>Page Layout with Grid Lines</h2>
        <div class="grid-layout">
            <div class="header">Header</div>
            <div class="sidebar">Sidebar</div>
            <div class="main">Main Content</div>
            <div class="footer">Footer</div>
        </div>
    </div>
</body>
</html>
