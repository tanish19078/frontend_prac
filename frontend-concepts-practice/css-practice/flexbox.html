<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { padding: 20px; background: #f4f4f9; }
        h1, h2 { margin-bottom: 12px; }
        .section { background: white; padding: 16px; margin-bottom: 20px; border-radius: 8px; }
        
        .flex-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #e2e8f0;
            padding: 12px;
        }

        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #e2e8f0;
            padding: 12px;
        }

        .item {
            background: #3b82f6;
            color: white;
            padding: 16px;
            border-radius: 6px;
            text-align: center;
            min-width: 80px;
        }

        .grow-1 { flex-grow: 1; background: #10b981; }
        .grow-2 { flex-grow: 2; background: #f59e0b; }
    </style>
</head>
<body>
    <h1>CSS Flexbox Practice</h1>

    <div class="section">
        <h2>Justify Content & Align Items</h2>
        <div class="flex-row">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
    </div>

    <div class="section">
        <h2>Flex Wrap & Gap</h2>
        <div class="flex-wrap">
            <div class="item">Item A</div>
            <div class="item">Item B</div>
            <div class="item">Item C</div>
            <div class="item">Item D</div>
            <div class="item">Item E</div>
            <div class="item">Item F</div>
        </div>
    </div>

    <div class="section">
        <h2>Flex Grow</h2>
        <div class="flex-row">
            <div class="item">Fixed</div>
            <div class="item grow-1">Grow 1</div>
            <div class="item grow-2">Grow 2</div>
        </div>
    </div>
</body>
</html>
