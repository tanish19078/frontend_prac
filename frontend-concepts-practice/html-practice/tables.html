<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables Practice</title>
</head>
<body>
    <h1>HTML Tables</h1>
    <table border="1" cellpadding="8" cellspacing="0">
        <caption>Employee Directory</caption>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Department</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>Alice</td>
                <td>Frontend Dev</td>
                <td rowspan="2">Engineering</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Bob</td>
                <td>Backend Dev</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Charlie</td>
                <td colspan="2">Product Manager</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total Employees</td>
                <td>3</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
